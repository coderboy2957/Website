<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Central Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* iPad dynamic viewport fix */
        body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="text-slate-100 flex flex-row font-sans">

    <!-- Mobile / iPad Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar (ChatGPT Style) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-slate-950 border-r border-slate-800/80 flex flex-col z-50 transition-transform -translate-x-full md:translate-x-0">
        <!-- Sidebar Header: New Chat -->
        <div class="p-3 border-b border-slate-800/60 flex items-center justify-between">
            <button onclick="createNewChat()" class="flex-1 flex items-center gap-2 bg-slate-900 hover:bg-slate-800 border border-slate-700/60 text-slate-200 px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Neuer Chat
            </button>
            <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Chat History -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1" id="chatHistoryList">
            <!-- Dynamisch generiert -->
        </div>

        <!-- Sidebar Footer: Settings & Keys -->
        <div class="p-3 border-t border-slate-800/60 bg-slate-950">
            <button onclick="openSettingsModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-900 transition cursor-pointer">
                <i data-lucide="key" class="w-4 h-4 text-indigo-400"></i>
                API-Keys & Einstellungen
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-slate-900 min-w-0">
        <!-- Top Navigation -->
        <header class="h-14 border-b border-slate-800/80 flex items-center justify-between px-4 bg-slate-900/80 backdrop-blur shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                    <i data-lucide="panel-left" class="w-5 h-5"></i>
                </button>
                
                <!-- Model Selector -->
                <div class="relative">
                    <select id="modelSelector" class="bg-slate-800 border border-slate-700/80 text-slate-100 font-medium text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer pr-8 appearance-none">
                        <optgroup label="OpenAI">
                            <option value="openai:gpt-4o">GPT-4o</option>
                            <option value="openai:gpt-4o-mini" selected>GPT-4o Mini</option>
                        </optgroup>
                        <optgroup label="Google Gemini">
                            <option value="google:gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="google:gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </optgroup>
                        <optgroup label="OpenRouter / Custom">
                            <option value="openrouter:anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                            <option value="openrouter:nvidia/llama-3.1-nemotron-70b-instruct">NVIDIA Llama 3.1</option>
                        </optgroup>
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-2.5 top-2.5 pointer-events-none"></i>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span id="toolBadge" class="hidden text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded-full flex items-center gap-1">
                    <i data-lucide="wrench" class="w-3 h-3"></i> Tools Aktiv
                </span>
            </div>
        </header>

        <!-- Chat Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-6 max-w-3xl w-full mx-auto">
            <!-- Willkommensbildschirm -->
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4">
                <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center border border-indigo-500/30">
                    <i data-lucide="bot" class="w-6 h-6"></i>
                </div>
                <h2 class="text-xl font-semibold">Wie kann ich dir heute helfen?</h2>
                <p class="text-slate-400 text-sm max-w-md">
                    Wähle dein bevorzugtes KI-Modell und steuere alles zentral. Hinterlege deine API-Keys unten in den Einstellungen.
                </p>
            </div>
        </div>

        <!-- Fixed Input Container (ChatGPT Style) -->
        <div class="p-3 md:p-4 border-t border-slate-800/80 bg-slate-900 shrink-0">
            <form id="chatForm" class="max-w-3xl mx-auto relative flex items-center">
                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="Nachricht an KI schreiben..." 
                    class="w-full bg-slate-800 text-slate-100 border border-slate-700/80 rounded-2xl pl-4 pr-12 py-3.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none max-h-40 custom-scrollbar"
                    onkeydown="handleKeyDown(event)"></textarea>
                <button type="submit" id="sendBtn" class="absolute right-2 bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition cursor-pointer disabled:opacity-40">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                </button>
            </form>
            <div class="text-center mt-2">
                <span class="text-[11px] text-slate-500">
                    Läuft lokal im Browser | Verbindet direkt mit den offiziellen APIs
                </span>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="key" class="w-5 h-5 text-indigo-400"></i> API-Keys Verwalten
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">OpenAI API Key</label>
                    <input type="password" id="keyOpenAI" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="sk-...">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Google Gemini API Key</label>
                    <input type="password" id="keyGoogle" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="AIzaSy...">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">OpenRouter API Key (Für Anthropic, NVIDIA etc.)</label>
                    <input type="password" id="keyOpenRouter" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="sk-or-v1-...">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="saveKeys()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition">
                    Speichern & Schließen
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        lucide.createIcons();

        // State Management
        let chats = JSON.parse(localStorage.getItem('ai_gateway_chats') || '[]');
        let currentChatId = null;
        let keys = JSON.parse(localStorage.getItem('ai_gateway_keys') || '{}');

        // Inputs laden
        document.getElementById('keyOpenAI').value = keys.openai || '';
        document.getElementById('keyGoogle').value = keys.google || '';
        document.getElementById('keyOpenRouter').value = keys.openrouter || '';

        // Auto-Resize für Textarea
        const userInput = document.getElementById('userInput');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chatForm').requestSubmit();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function saveKeys() {
            keys = {
                openai: document.getElementById('keyOpenAI').value.trim(),
                google: document.getElementById('keyGoogle').value.trim(),
                openrouter: document.getElementById('keyOpenRouter').value.trim()
            };
            localStorage.setItem('ai_gateway_keys', JSON.stringify(keys));
            closeSettingsModal();
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: 'Neuer Chat', messages: [] });
            saveChats();
            renderChatHistory();
            renderMessages();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function saveChats() {
            localStorage.setItem('ai_gateway_chats', JSON.stringify(chats));
        }

        function renderChatHistory() {
            const container = document.getElementById('chatHistoryList');
            container.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-sm flex items-center justify-between group transition ${isActive ? 'bg-slate-800 text-white font-medium' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'}`;
                btn.onclick = () => { currentChatId = chat.id; renderMessages(); renderChatHistory(); };
                btn.innerHTML = `
                    <span class="truncate flex-1">${chat.title}</span>
                    <i data-lucide="trash-2" onclick="deleteChat(event, '${chat.id}')" class="w-4 h-4 text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition"></i>
                `;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) currentChatId = chats.length > 0 ? chats[0].id : null;
            saveChats();
            renderChatHistory();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chatContainer');
            const emptyState = document.getElementById('emptyState');
            
            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat || currentChat.messages.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyState);
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = '';

            currentChat.messages.forEach(m => {
                const isUser = m.role === 'user';
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;
                
                msgDiv.innerHTML = `
                    <div class="flex gap-3 max-w-[85%] ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400 border border-slate-700'}">
                            <i data-lucide="${isUser ? 'user' : 'bot'}" class="w-4 h-4"></i>
                        </div>
                        <div class="space-y-1">
                            ${m.toolCall ? `
                                <div class="text-xs bg-slate-800 border border-slate-700 text-indigo-300 px-2.5 py-1 rounded-lg inline-flex items-center gap-1.5 mb-1">
                                    <i data-lucide="wrench" class="w-3 h-3"></i> Tool ausgeführt: <b>${m.toolCall}</b>
                                </div>` : ''}
                            <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800/90 border border-slate-700/60 text-slate-100'} p-3.5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap">
                                ${m.content}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(msgDiv);
            });
            lucide.createIcons();
            container.scrollTop = container.scrollHeight;
        }

        // Chat Form Handling & API Routing
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            if (!currentChatId) {
                currentChatId = Date.now().toString();
                chats.unshift({ id: currentChatId, title: text.slice(0, 25) + '...', messages: [] });
            }

            const currentChat = chats.find(c => c.id === currentChatId);
            currentChat.messages.push({ role: 'user', content: text });
            
            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();

            // Ausgewähltes Modell
            const [provider, modelName] = document.getElementById('modelSelector').value.split(':');
            
            // Dummy Antwort vorbereitung
            const assistantMsg = { role: 'assistant', content: 'Denkt nach...' };
            currentChat.messages.push(assistantMsg);
            renderMessages();

            try {
                let reply = '';
                let toolUsed = null;

                // Beispielhafte Tool-Erkennung (Client-side Function Calling Demo)
                if (text.toLowerCase().includes('zeit') || text.toLowerCase().includes('uhr')) {
                    toolUsed = "get_current_time";
                    reply = `[Tool Executed] Die aktuelle Uhrzeit lautet: ${new Date().toLocaleTimeString('de-DE')}`;
                } else if (provider === 'openai') {
                    if (!keys.openai) throw new Error("Kein OpenAI API-Key hinterlegt!");
                    reply = await fetchOpenAI(modelName, currentChat.messages.slice(0, -1));
                } else if (provider === 'google') {
                    if (!keys.google) throw new Error("Kein Google API-Key hinterlegt!");
                    reply = await fetchGemini(modelName, currentChat.messages.slice(0, -1));
                } else if (provider === 'openrouter') {
                    if (!keys.openrouter) throw new Error("Kein OpenRouter API-Key hinterlegt!");
                    reply = await fetchOpenRouter(modelName, currentChat.messages.slice(0, -1));
                }

                assistantMsg.content = reply;
                if (toolUsed) assistantMsg.toolCall = toolUsed;

            } catch (err) {
                assistantMsg.content = `Fehler: ${err.message}`;
            }

            saveChats();
            renderChatHistory();
            renderMessages();
        });

        // API Fetch Routinen
        async function fetchOpenAI(model, msgs) {
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${keys.openai}` },
                body: JSON.stringify({ model, messages: msgs.map(m => ({ role: m.role, content: m.content })) })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'OpenAI Fehler');
            return data.choices[0].message.content;
        }

        async function fetchGemini(model, msgs) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${keys.google}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })) })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'Gemini Fehler');
            return data.candidates[0].content.parts[0].text;
        }

        async function fetchOpenRouter(model, msgs) {
            const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${keys.openrouter}` },
                body: JSON.stringify({ model, messages: msgs.map(m => ({ role: m.role, content: m.content })) })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'OpenRouter Fehler');
            return data.choices[0].message.content;
        }

        // Init beim Laden
        if (chats.length > 0) currentChatId = chats[0].id;
        renderChatHistory();
        renderMessages();
    </script>
</body>
</html>
