<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stark VARG Full-Screen Dashboard</title>
    <!-- Stark VARG Style Font (Teko & Rajdhani) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090b10;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --rpm-green: #00ff66;
            --rpm-yellow: #ffcc00;
            --rpm-red: #ff0033;
            --panel-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body.hud-mode {
            transform: scaleX(-1);
        }

        /* Full Screen Layout */
        .dashboard-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            padding: 4vh 5vw;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
        }

        .rpm-display-text {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            line-height: 1;
            letter-spacing: 0.05em;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .rpm-display-text span {
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .settings-btn:active {
            transform: scale(0.9);
            color: var(--text-main);
        }

        /* Center Display */
        .center-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .gauge-canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .speed-value-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10vh; /* Offset to sit nicely in the arc */
        }

        .speed-number {
            font-family: 'Teko', sans-serif;
            font-size: 30vmin; /* Responsive massive font */
            font-weight: 700;
            line-height: 0.75;
            color: var(--text-main);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            letter-spacing: -0.02em;
        }

        .speed-unit {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5vmin;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin-top: 15px;
        }

        /* Bottom Status Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #334155;
            box-shadow: 0 0 0 rgba(0,0,0,0);
            transition: all 0.3s;
        }

        .status-dot.active {
            background: var(--rpm-green);
            box-shadow: 0 0 15px var(--rpm-green);
        }

        /* Settings Modal (Glassmorphism Dark) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            width: 90vw; max-width: 450px;
            border-radius: 24px;
            padding: 30px;
            display: flex; flex-direction: column; gap: 25px;
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal-overlay.open .modal-content { transform: scale(1); }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-header h3 {
            font-family: 'Teko', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 0.05em;
            color: var(--text-main);
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none; color: #fff;
            width: 36px; height: 36px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer;
        }

        .setting-group { display: flex; flex-direction: column; gap: 10px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; }
        .setting-row span, .setting-group label {
            font-size: 1.1rem; font-weight: 600; color: #cbd5e1;
        }

        input[type="range"] {
            width: 100%; height: 6px; background: #334155;
            border-radius: 3px; outline: none; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            background: #fff; border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        select, input[type="number"] {
            background: rgba(0,0,0,0.5); border: 1px solid #475569;
            color: #fff; padding: 12px; border-radius: 12px;
            font-size: 1.1rem; font-family: 'Rajdhani', sans-serif;
            font-weight: 600; outline: none;
        }

        .btn-primary {
            background: #fff; color: #000; border: none;
            padding: 16px; border-radius: 12px; font-family: 'Rajdhani', sans-serif;
            font-weight: 700; font-size: 1.2rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.1em;
        }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 54px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-switch {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .3s; border-radius: 30px;
        }
        .slider-switch:before {
            position: absolute; content: ""; height: 22px; width: 22px;
            left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider-switch { background-color: var(--rpm-green); box-shadow: 0 0 15px rgba(0,255,102,0.4); }
        input:checked + .slider-switch:before { transform: translateX(24px); }

        /* Manual Control */
        .manual-control-bar {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; background: rgba(15,23,42,0.8);
            backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 20px;
            display: flex; align-items: center; gap: 20px; z-index: 30;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .manual-control-bar.hidden { display: none; }
        #manualSliderVal { font-family: 'Teko', sans-serif; font-size: 2rem; width: 50px; text-align: right; }

    </style>
</head>
<body>

    <!-- Full Screen Container -->
    <div class="dashboard-container">
        
        <!-- Top Info -->
        <div class="top-bar">
            <div class="rpm-display-text" id="rpmTextDisplay">0 <span>RPM</span></div>
            <button class="settings-btn" id="openSettings">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2.2 2.2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <!-- Center Tacho & Gauge Layer -->
        <div class="center-display">
            <div class="gauge-canvas-wrapper">
                <canvas id="gaugeCanvas"></canvas>
            </div>
            <div class="speed-value-container">
                <div class="speed-number" id="speedDisplay">0</div>
                <div class="speed-unit">km/h</div>
            </div>
        </div>

        <!-- Bottom Info -->
        <div class="bottom-bar">
            <div class="status-pill">
                <div class="status-dot" id="gpsStatusDot"></div>
                <span id="gpsStatusText">GPS OFF</span>
            </div>
        </div>
    </div>

    <!-- Manual Simulator -->
    <div class="manual-control-bar" id="manualBar">
        <span style="font-family: 'Teko', sans-serif; font-size: 1.5rem; letter-spacing: 0.1em;">SIM</span>
        <input type="range" id="manualSpeedSlider" min="0" max="200" value="0" style="flex:1;">
        <span id="manualSliderVal">0</span>
    </div>

    <!-- Settings Overlay -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>SYSTEM SETTINGS</h3>
                <button class="close-btn" id="closeSettings">✕</button>
            </div>

            <div class="setting-group">
                <div class="setting-row">
                    <span>GPS Telemetry</span>
                    <label class="switch">
                        <input type="checkbox" id="gpsToggle">
                        <span class="slider-switch"></span>
                    </label>
                </div>
            </div>

            <div class="setting-group">
                <label>Wheel Size (Inches)</label>
                <div style="display: flex; gap: 10px;">
                    <select id="tirePreset" style="flex: 2;">
                        <option value="10">10" (Scooter)</option>
                        <option value="19">19" (MX Rear)</option>
                        <option value="21">21" (MX Front)</option>
                        <option value="28" selected>28" (Street)</option>
                        <option value="custom">Custom</option>
                    </select>
                    <input type="number" id="customTireSize" value="28" min="4" max="50" style="flex: 1;" disabled>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-row">
                    <label>Redline Limit</label>
                    <span id="redlineValText" style="font-family:'Teko', sans-serif; font-size: 1.8rem;">10000</span>
                </div>
                <!-- Requested Range: 10 to 10000 -->
                <input type="range" id="redlineSlider" min="10" max="10000" step="10" value="10000">
            </div>

            <div class="setting-group">
                <div class="setting-row">
                    <span>HUD Mirror View</span>
                    <label class="switch">
                        <input type="checkbox" id="hudToggle">
                        <span class="slider-switch"></span>
                    </label>
                </div>
            </div>

            <button class="btn-primary" id="saveAndClose">CONFIRM</button>
        </div>
    </div>

    <script>
        // Core State
        let currentSpeed = 0;
        let displaySpeed = 0;
        let currentRpm = 0;
        let displayRpm = 0;
        let maxRpmLimit = 10000;
        let tireSizeInches = 28;
        let gpsActive = false;
        let gpsWatchId = null;

        // Elements
        const speedDisplay = document.getElementById('speedDisplay');
        const rpmTextDisplay = document.getElementById('rpmTextDisplay');
        const canvas = document.getElementById('gaugeCanvas');
        const ctx = canvas.getContext('2d');
        const manualBar = document.getElementById('manualBar');
        const manualSpeedSlider = document.getElementById('manualSpeedSlider');
        const manualSliderVal = document.getElementById('manualSliderVal');
        
        const settingsModal = document.getElementById('settingsModal');
        const openSettingsBtn = document.getElementById('openSettings');
        const closeSettingsBtn = document.getElementById('closeSettings');
        const saveAndCloseBtn = document.getElementById('saveAndClose');
        const gpsToggle = document.getElementById('gpsToggle');
        const hudToggle = document.getElementById('hudToggle');
        const tirePreset = document.getElementById('tirePreset');
        const customTireSize = document.getElementById('customTireSize');
        const redlineSlider = document.getElementById('redlineSlider');
        const redlineValText = document.getElementById('redlineValText');
        const gpsStatusDot = document.getElementById('gpsStatusDot');
        const gpsStatusText = document.getElementById('gpsStatusText');

        // High DPI Canvas Setup for Full Screen
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function calculateRPM(speedKmh, tireInches) {
            if (speedKmh <= 0 || tireInches <= 0) return 0;
            return (speedKmh * 1000 / 60) / (Math.PI * tireInches * 0.0254);
        }

        // Draw Advanced Segmented Neon Arc
        function drawGauge() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            ctx.clearRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height * 0.65; // Position arc to frame the text
            const radius = Math.min(width * 0.45, height * 0.55);
            
            const startAngle = Math.PI * 0.8;
            const endAngle = Math.PI * 2.2;
            const totalAngleSpan = endAngle - startAngle;

            // Segment configuration
            const totalSegments = 60; // Cool digital LED look
            const segmentGap = 0.025; 
            const segmentSpan = (totalAngleSpan / totalSegments) - segmentGap;

            // 1. Draw Inactive Background Track (Dark transparent dashes)
            for (let i = 0; i < totalSegments; i++) {
                const a1 = startAngle + i * (segmentSpan + segmentGap);
                const a2 = a1 + segmentSpan;
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, a1, a2);
                ctx.lineWidth = 12;
                ctx.lineCap = 'butt';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.shadowBlur = 0;
                ctx.stroke();
            }

            // 2. Draw Active Glow Segments
            const rpmRatio = Math.min(Math.max(displayRpm / maxRpmLimit, 0), 1);
            if (rpmRatio > 0) {
                const activeSegments = Math.floor(rpmRatio * totalSegments);
                
                for (let i = 0; i < activeSegments; i++) {
                    const a1 = startAngle + i * (segmentSpan + segmentGap);
                    const a2 = a1 + segmentSpan;
                    const pointRatio = i / totalSegments;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, a1, a2);
                    ctx.lineWidth = 14; 
                    ctx.lineCap = 'round'; // rounded glowing LEDs
                    
                    // Color Logic
                    let segmentColor;
                    if (pointRatio < 0.65) {
                        segmentColor = '#00ff66'; // Stark Green
                    } else if (pointRatio < 0.85) {
                        segmentColor = '#ffcc00'; // Warning Yellow
                    } else {
                        segmentColor = '#ff0033'; // Redline
                    }

                    ctx.strokeStyle = segmentColor;
                    
                    // Add Neon Glow
                    ctx.shadowColor = segmentColor;
                    ctx.shadowBlur = 15; // Intense glow

                    ctx.stroke();
                }
            }
            
            // Reset shadow for other drawings
            ctx.shadowBlur = 0;
        }

        // 60FPS Render Loop
        function update() {
            displaySpeed += (currentSpeed - displaySpeed) * 0.15;
            displayRpm += (currentRpm - displayRpm) * 0.15;

            speedDisplay.textContent = Math.round(displaySpeed);
            rpmTextDisplay.innerHTML = `${Math.round(displayRpm)} <span>RPM</span>`;

            drawGauge();
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);

        // --- Event Listeners & Logic ---

        manualSpeedSlider.addEventListener('input', (e) => {
            if (!gpsActive) {
                currentSpeed = parseFloat(e.target.value);
                manualSliderVal.textContent = Math.round(currentSpeed);
                currentRpm = calculateRPM(currentSpeed, tireSizeInches);
            }
        });

        const toggleModal = (show) => {
            if(show) settingsModal.classList.add('open');
            else settingsModal.classList.remove('open');
        };
        openSettingsBtn.addEventListener('click', () => toggleModal(true));
        closeSettingsBtn.addEventListener('click', () => toggleModal(false));
        saveAndCloseBtn.addEventListener('click', () => toggleModal(false));

        tirePreset.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customTireSize.disabled = false;
                customTireSize.focus();
                tireSizeInches = parseFloat(customTireSize.value) || 28;
            } else {
                customTireSize.disabled = true;
                tireSizeInches = parseFloat(e.target.value);
                customTireSize.value = tireSizeInches;
            }
            currentRpm = calculateRPM(currentSpeed, tireSizeInches);
        });

        customTireSize.addEventListener('input', (e) => {
            tireSizeInches = parseFloat(e.target.value) || 28;
            currentRpm = calculateRPM(currentSpeed, tireSizeInches);
        });

        // Dynamic Redline Limit (10 to 10000)
        redlineSlider.addEventListener('input', (e) => {
            maxRpmLimit = parseInt(e.target.value);
            redlineValText.textContent = maxRpmLimit;
        });

        hudToggle.addEventListener('change', (e) => {
            if (e.target.checked) document.body.classList.add('hud-mode');
            else document.body.classList.remove('hud-mode');
        });

        gpsToggle.addEventListener('change', (e) => {
            gpsActive = e.target.checked;
            if (gpsActive) startGpsTracking();
            else stopGpsTracking();
        });

        function startGpsTracking() {
            if (!navigator.geolocation) {
                alert('GPS Not Supported.');
                gpsToggle.checked = false;
                gpsActive = false;
                return;
            }

            gpsStatusText.textContent = 'GPS SEARCHING';
            manualBar.classList.add('hidden');

            const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

            gpsWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatusDot.classList.add('active');
                    gpsStatusText.textContent = 'GPS LINKED';
                    
                    const speedMs = position.coords.speed;
                    currentSpeed = (speedMs !== null && speedMs >= 0) ? (speedMs * 3.6) : 0;
                    currentRpm = calculateRPM(currentSpeed, tireSizeInches);
                },
                (error) => {
                    gpsStatusDot.classList.remove('active');
                    gpsStatusText.textContent = 'NO SIGNAL';
                },
                options
            );
        }

        function stopGpsTracking() {
            if (gpsWatchId !== null) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
            }
            gpsStatusDot.classList.remove('active');
            gpsStatusText.textContent = 'GPS OFF';
            manualBar.classList.remove('hidden');
        }
    </script>
</body>
</html>
