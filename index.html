<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Fast Brute-Force Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-xl glass-card rounded-2xl p-6 md:p-8 shadow-2xl border border-gray-800">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          Turbo Brute-Force Lab
        </h1>
        <p class="text-xs text-gray-400 mt-1">Multi-Threaded Hardware Engine</p>
      </div>
      <div id="threadBadge" class="bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 text-xs font-mono px-3 py-1 rounded-full">
        Detecting Cores...
      </div>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1">Ziel-Passwort</label>
        <input type="text" id="targetPassword" value="987654" placeholder="z. B. 1234 oder secret"
          class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-lg font-mono text-emerald-400 focus:outline-none focus:border-emerald-500 transition">
      </div>

      <!-- Presets -->
      <div class="flex flex-wrap gap-2 text-xs">
        <span class="text-gray-500 self-center mr-1">Presets:</span>
        <button onclick="setPreset('7421')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg transition">4-Digits</button>
        <button onclick="setPreset('987654')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg transition">6-Digits</button>
        <button onclick="setPreset('abc12')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg transition">Kleinbuchstaben</button>
        <button onclick="setPreset('Pass12')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg transition">Mix</button>
      </div>

      <!-- Control Button -->
      <button id="startBtn" onclick="toggleEngine()" 
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-950/50 transition duration-150 active:scale-[0.99] mt-2">
        Starten (Max Speed)
      </button>
    </div>

    <!-- Stats Display -->
    <div class="grid grid-cols-2 gap-3 mt-6">
      <div class="bg-gray-950/80 border border-gray-800/80 rounded-xl p-3 text-center">
        <span class="text-[10px] uppercase tracking-wider text-gray-500 block">Geschwindigkeit</span>
        <span id="speedVal" class="text-xl md:text-2xl font-mono font-bold text-emerald-400">0 /s</span>
      </div>

      <div class="bg-gray-950/80 border border-gray-800/80 rounded-xl p-3 text-center">
        <span class="text-[10px] uppercase tracking-wider text-gray-500 block">Verstrichene Zeit</span>
        <span id="timeVal" class="text-xl md:text-2xl font-mono font-bold text-gray-200">0.00s</span>
      </div>
    </div>

    <div class="bg-gray-950/80 border border-gray-800/80 rounded-xl p-4 mt-3 text-center">
      <span class="text-[10px] uppercase tracking-wider text-gray-500 block mb-1">Gesamtversuche</span>
      <span id="totalAttemptsVal" class="text-2xl md:text-3xl font-mono font-bold text-white">0</span>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="mt-4 bg-gray-950 border border-gray-800 rounded-xl p-4 text-center">
      <span id="statusText" class="text-sm font-mono text-gray-400">Bereit für Testlauf</span>
    </div>

  </div>

  <script>
    let isRunning = false;
    let startTime = 0;
    let timerInterval = null;
    let totalAttempts = 0;
    let workers = [];
    const numCores = navigator.hardwareConcurrency || 4;

    document.getElementById('threadBadge').innerText = `${numCores} CPU-Kerne aktiv`;

    // Inline Web Worker Source Code for Maximum Iteration Throughput
    const workerCode = `
      self.onmessage = function(e) {
        const { target, charset, startIndex, stride, batchSize } = e.data;
        const charsetLen = charset.length;
        const targetLen = target.length;
        
        let currentIndex = startIndex;
        
        function getCandidate(idx, len) {
          let str = '';
          for (let i = 0; i < len; i++) {
            str = charset[idx % charsetLen] + str;
            idx = Math.floor(idx / charsetLen);
          }
          return str;
        }

        function runBatch() {
          let attemptsInBatch = 0;
          
          while (attemptsInBatch < batchSize) {
            const candidate = getCandidate(currentIndex, targetLen);
            attemptsInBatch++;
            
            if (candidate === target) {
              self.postMessage({ type: 'FOUND', candidate, attempts: attemptsInBatch });
              return;
            }
            
            currentIndex += stride;
          }
          
          self.postMessage({ type: 'PROGRESS', attempts: attemptsInBatch });
          setTimeout(runBatch, 0);
        };

        runBatch();
      };
    `;

    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);

    function buildCharset(target) {
      let hasDigits = /[0-9]/.test(target);
      let hasLower = /[a-z]/.test(target);
      let hasUpper = /[A-Z]/.test(target);
      let hasSpecial = /[^a-zA-Z0-9]/.test(target);

      let charset = "";
      if (hasDigits) charset += "0123456789";
      if (hasLower) charset += "abcdefghijklmnopqrstuvwxyz";
      if (hasUpper) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (hasSpecial) charset += "!@#$%^&*()_+-=[]{}|;:,.<>?";

      if (!charset) charset = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
      return charset;
    }

    function setPreset(val) {
      if (isRunning) stopEngine();
      document.getElementById('targetPassword').value = val;
    }

    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(2) + ' Mrd.';
      if (num >= 1e6) return (num / 1e6).toFixed(2) + ' Mio.';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + ' Tsd.';
      return num.toLocaleString();
    }

    function toggleEngine() {
      if (isRunning) {
        stopEngine();
      } else {
        startEngine();
      }
    }

    function startEngine() {
      const target = document.getElementById('targetPassword').value;
      if (!target) return;

      const charset = buildCharset(target);
      isRunning = true;
      totalAttempts = 0;
      startTime = performance.now();

      document.getElementById('startBtn').innerText = "Stoppen";
      document.getElementById('startBtn').className = "w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-150 active:scale-[0.99] mt-2";
      document.getElementById('statusText').innerText = "Suche läuft mit maximaler Leistung...";
      document.getElementById('statusText').className = "text-sm font-mono text-emerald-400 animate-pulse";

      // Start Stats Update Loop
      timerInterval = setInterval(updateStats, 100);

      // Spawn Multi-Threaded Workers
      workers = [];
      const batchSize = 500000; // Large chunk size for zero DOM overhead

      for (let i = 0; i < numCores; i++) {
        const worker = new Worker(workerUrl);
        
        worker.onmessage = function(e) {
          if (!isRunning) return;

          if (e.data.type === 'PROGRESS') {
            totalAttempts += e.data.attempts;
          } else if (e.data.type === 'FOUND') {
            totalAttempts += e.data.attempts;
            onFound(e.data.candidate);
          }
        };

        worker.postMessage({
          target: target,
          charset: charset,
          startIndex: i,
          stride: numCores,
          batchSize: batchSize
        });

        workers.push(worker);
      }
    }

    function stopEngine() {
      isRunning = false;
      workers.forEach(w => w.terminate());
      workers = [];
      clearInterval(timerInterval);

      document.getElementById('startBtn').innerText = "Starten (Max Speed)";
      document.getElementById('startBtn').className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-950/50 transition duration-150 active:scale-[0.99] mt-2";
    }

    function updateStats() {
      const elapsedSec = (performance.now() - startTime) / 1000;
      const rps = elapsedSec > 0 ? Math.round(totalAttempts / elapsedSec) : 0;

      document.getElementById('speedVal').innerText = formatNumber(rps) + ' /s';
      document.getElementById('timeVal').innerText = elapsedSec.toFixed(2) + 's';
      document.getElementById('totalAttemptsVal').innerText = totalAttempts.toLocaleString();
    }

    function onFound(candidate) {
      stopEngine();
      updateStats();

      document.getElementById('statusText').innerText = `Gefunden! Passwort lautet: "${candidate}"`;
      document.getElementById('statusText').className = "text-sm font-mono font-bold text-emerald-400";
    }
  </script>
</body>
</html>
